name: KnowledgeBase
options:
  bundleIdPrefix: com.km
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    INFOPLIST_FILE: KnowledgeBase/Info.plist
    DEVELOPMENT_TEAM: ""

targets:
  KnowledgeBase:
    type: application
    platform: iOS
    sources:
      - path: KnowledgeBase
        excludes:
          - "**/MacOS.lproj/**"
          - "**/MacInfo.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.km.app
        INFOPLIST_FILE: KnowledgeBase/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: "YES"

  KMMac:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: KnowledgeBase
        excludes:
          - "**/*.md"
          - "**/Base.lproj/**"
          - "**/Info.plist"
          - "**/MacInfo.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.km.app
        INFOPLIST_FILE: KnowledgeBase/MacInfo.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: "YES"
        CODE_SIGN_ENTITLEMENTS: KnowledgeBase/KnowledgeBase.entitlements
        SDKROOT: iphoneos
        TARGETED_DEVICE_FAMILY: "2"
        SUPPORTS_MACCATALYST: "YES"

  KMTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - KMTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.km.app.tests
        SWIFT_EMIT_LOC_STRINGS: "YES"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_FILE: ""
    dependencies:
      - target: KnowledgeBase

  KMUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - KMUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.km.app.uitests
        SWIFT_EMIT_LOC_STRINGS: "YES"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_FILE: ""
        UI_TARGET_FOR_PREVIEWS: "YES"
    dependencies:
      - target: KnowledgeBase

  KMWatch:
    type: application
    platform: watchOS
    sources:
      - KMWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.km.app.watch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_EMIT_LOC_STRINGS: "YES"
        SDKROOT: watchos
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_FILE: ""
    dependencies:
      - target: KnowledgeBase